<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTAKKU AI</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    .app {
      max-width: 500px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }

    header {
      padding: 35px 25px 25px;
      background: #111827;
      color: white;
      border-radius: 0 0 25px 25px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      color: #d1d5db;
    }

    .content {
      padding: 25px;
    }

    .box {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .box h2 {
      margin-top: 0;
      font-size: 20px;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      resize: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .memory {
      padding: 12px;
      background: white;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      margin-top: 10px;
    }

    .empty {
      color: #6b7280;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>🧠 OTAKKU AI</h1>
    <p>Biar aku yang ingat.</p>
  </header>

  <div class="content">

    <div class="box">
      <h2>📝 Apa yang kau nak aku ingat?</h2>

      <textarea
        id="memoryInput"
        placeholder="Contoh: Aku letak kunci motor dalam laci bilik...">
      </textarea>

      <button onclick="saveMemory()">
        💾 Simpan Memory
      </button>
    </div>

    <div class="box">
      <h2>🧠 Memory Aku</h2>

      <div id="memoryList">
        <div class="empty">
          Belum ada memory disimpan.
        </div>
      </div>
    </div>

  </div>

</div>

<script>

function saveMemory() {

  const input = document.getElementById("memoryInput");
  const text = input.value.trim();

  if (text === "") {
    alert("Tulis dulu apa yang kau nak aku ingat.");
    return;
  }

  let memories =
    JSON.parse(localStorage.getItem("otakku_memories")) || [];

  memories.push({
    text: text,
    date: new Date().toLocaleString("ms-MY")
  });

  localStorage.setItem(
    "otakku_memories",
    JSON.stringify(memories)
  );

  input.value = "";

  displayMemories();
}

function displayMemories() {

  const list = document.getElementById("memoryList");

  let memories =
    JSON.parse(localStorage.getItem("otakku_memories")) || [];

  if (memories.length === 0) {

    list.innerHTML =
      '<div class="empty">Belum ada memory disimpan.</div>';

    return;
  }

  list.innerHTML = "";

  memories.reverse().forEach(memory => {

    const div = document.createElement("div");

    div.className = "memory";

    div.innerHTML =
      "<strong>" + memory.text + "</strong>" +
      "<br><small>" + memory.date + "</small>";

    list.appendChild(div);

  });
}

displayMemories();

</script>

</body>
</html>
