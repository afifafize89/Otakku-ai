<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OTAKKU AI</title>

<style>
*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f1f3f5;
color:#222;
}

.app{
max-width:520px;
margin:auto;
min-height:100vh;
background:white;
}

header{
background:#111827;
color:white;
padding:30px 22px;
border-radius:0 0 25px 25px;
}

header h1{
margin:0;
font-size:30px;
}

header p{
margin:8px 0 0;
color:#d1d5db;
}

.content{
padding:20px;
}

.box{
background:#f8fafc;
border:1px solid #e5e7eb;
border-radius:18px;
padding:18px;
margin-bottom:18px;
}

h2{
font-size:19px;
margin-top:0;
}

textarea,
input{
width:100%;
padding:14px;
border:1px solid #d1d5db;
border-radius:12px;
font-size:16px;
}

textarea{
height:100px;
resize:none;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:0;
border-radius:12px;
background:#111827;
color:white;
font-size:16px;
font-weight:bold;
}

.memory{
background:white;
border:1px solid #e5e7eb;
border-radius:12px;
padding:14px;
margin-top:10px;
}

.memory small{
color:#6b7280;
}

.delete{
background:#dc2626;
font-size:13px;
padding:9px;
}

.answer{
background:#eef2ff;
border-radius:12px;
padding:15px;
margin-top:12px;
line-height:1.5;
}

.empty{
color:#6b7280;
font-size:14px;
}
</style>
</head>

<body>

<div class="app">

<header>
<h1>🧠 OTAKKU AI</h1>
<p>Biar aku yang ingat.</p>
</header>

<div class="content">

<!-- TANYA OTAKKU -->

<div class="box">

<h2>🤖 Tanya OTAKKU</h2>

<input
id="question"
placeholder="Contoh: Kunci motor aku dekat mana?">

<button onclick="askOtakku()">
🧠 Tanya
</button>

<div id="answer"></div>

</div>


<!-- SIMPAN MEMORY -->

<div class="box">

<h2>📝 Simpan Memory</h2>

<textarea
id="memoryInput"
placeholder="Contoh: Kunci motor aku sangkut tepi pintu utama.">
</textarea>

<button onclick="saveMemory()">
💾 Simpan Memory
</button>

</div>


<!-- SEARCH -->

<div class="box">

<h2>🔍 Cari Memory</h2>

<input
id="searchInput"
placeholder="Contoh: kunci"
oninput="displayMemories()">

</div>


<!-- MEMORY -->

<div class="box">

<h2>🧠 Memory Aku</h2>

<div id="memoryList"></div>

</div>

</div>

</div>


<script>

function getMemories(){

return JSON.parse(
localStorage.getItem("otakku_memories")
) || [];

}


/* SIMPAN MEMORY */

function saveMemory(){

const input =
document.getElementById("memoryInput");

const text =
input.value.trim();

if(!text){

alert("Tulis dulu apa yang kau nak aku ingat.");

return;

}

let memories=getMemories();

memories.push({

text:text,

date:new Date().toLocaleString("ms-MY")

});

localStorage.setItem(
"otakku_memories",
JSON.stringify(memories)
);

input.value="";

displayMemories();

}


/* PADAM MEMORY */

function deleteMemory(index){

let memories=getMemories();

memories.splice(index,1);

localStorage.setItem(
"otakku_memories",
JSON.stringify(memories)
);

displayMemories();

}


/* CARI MEMORY */

function displayMemories(){

const list=
document.getElementById("memoryList");

const search=
document.getElementById("searchInput")
.value
.toLowerCase()
.trim();

let memories=getMemories();

const filtered=memories
.map((memory,index)=>({
memory,
index
}))
.filter(item=>
item.memory.text
.toLowerCase()
.includes(search)
);

if(filtered.length===0){

list.innerHTML=
'<div class="empty">Memory tidak dijumpai.</div>';

return;

}

list.innerHTML="";

filtered.reverse().forEach(item=>{

const div=document.createElement("div");

div.className="memory";

div.innerHTML=
"<strong>"
+
item.memory.text
+
"</strong><br>"
+
"<small>"
+
item.memory.date
+
"</small>"
+
"<button class='delete' onclick='deleteMemory("
+
item.index
+
")'>🗑️ Padam</button>";

list.appendChild(div);

});

}


/* TANYA OTAKKU */

function askOtakku(){

const question=
document.getElementById("question")
.value
.toLowerCase()
.trim();

const answer=
document.getElementById("answer");

if(!question){

answer.innerHTML=
'<div class="answer">Tanya aku sesuatu dulu 😊</div>';

return;

}

const memories=getMemories();

if(memories.length===0){

answer.innerHTML=
'<div class="answer">Aku belum ada memory. Cuba simpan sesuatu dulu.</div>';

return;

}


/*
  Ambil perkataan penting daripada soalan.
  Perkataan umum dibuang supaya carian
  lebih berguna.
*/

const stopWords=[
"aku",
"kau",
"apa",
"mana",
"kat",
"dekat",
"di",
"ke",
"yang",
"itu",
"ini",
"ada",
"tak",
"tidak",
"pun",
"nak",
"ingin",
"boleh",
"tahu",
"tolong",
"ingatkan"
];

const words=question
.replace(/[?!.,]/g,"")
.split(/\s+/)
.filter(word=>
word.length>2 &&
!stopWords.includes(word)
);


/*
  Cari memory berdasarkan perkataan
  yang sama.
*/

let bestMemory=null;
let bestScore=0;

memories.forEach(memory=>{

const text=
memory.text.toLowerCase();

let score=0;

words.forEach(word=>{

if(text.includes(word)){
score++;
}

});

if(score>bestScore){

bestScore=score;
bestMemory=memory;

}

});


if(bestMemory && bestScore>0){

answer.innerHTML=
'<div class="answer">' +
'💡 <strong>Aku ingat:</strong><br><br>' +
bestMemory.text +
'</div>';

}else{

answer.innerHTML=
'<div class="answer">' +
'🤔 Aku belum jumpa jawapan dalam memory aku.' +
'<br><br>' +
'Cuba simpan perkara itu dulu.' +
'</div>';

}

}


displayMemories();

</script>

</body>
</html>
