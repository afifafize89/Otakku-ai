<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTAKKU AI</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f1f3f5;
  color: #222;
}

.app {
  max-width: 520px;
  margin: auto;
  min-height: 100vh;
  background: white;
}

header {
  background: #111827;
  color: white;
  padding: 30px 22px;
  border-radius: 0 0 25px 25px;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 8px 0 0;
  color: #d1d5db;
}

.content {
  padding: 20px;
}

.box {
  background: #f8fafc;
  border: 1px solid #e5e7eb;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 18px;
}

h2 {
  font-size: 19px;
  margin-top: 0;
}

textarea,
input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d1d5db;
  border-radius: 12px;
  font-size: 16px;
}

textarea {
  height: 100px;
  resize: none;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 0;
  border-radius: 12px;
  background: #111827;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.answer {
  background: #eef2ff;
  border-radius: 12px;
  padding: 15px;
  margin-top: 12px;
  line-height: 1.5;
}

.memory {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 14px;
  margin-top: 10px;
}

.memory small {
  color: #6b7280;
}

.delete {
  background: #dc2626;
  font-size: 13px;
  padding: 9px;
}

.history {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 14px;
  margin-top: 10px;
}

.history-question {
  font-weight: bold;
}

.history-answer {
  margin-top: 6px;
  color: #374151;
}

.history-date {
  margin-top: 8px;
  color: #6b7280;
  font-size: 12px;
}

.clear {
  background: #6b7280;
}

.empty {
  color: #6b7280;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="app">

<header>
<h1>🧠 OTAKKU AI</h1>
<p>Biar aku yang ingat.</p>
</header>

<div class="content">
<!-- REMINDER -->

<div class="box">

<h2>⏰ Reminder</h2>

<input
id="reminderText"
placeholder="Contoh: Bayar bil elektrik">

<br><br>

<input
id="reminderDate"
type="date">

<br><br>

<input
id="reminderTime"
type="time">

<button onclick="saveReminder()">
⏰ Simpan Reminder
</button>

<div id="reminderList"></div>

</div>
<!-- TANYA -->

<div class="box">

<h2>🤖 Tanya OTAKKU</h2>

<input
id="question"
placeholder="Contoh: Kunci motor aku dekat mana?">
<button onclick="voiceQuestion()">
🎙️ Tanya Dengan Suara
</button>
<button onclick="askOtakku()">
🧠 Tanya
</button>

<div id="answer"></div>

</div>


<!-- SIMPAN MEMORY -->

<div class="box">

<h2>💾 Simpan Memory</h2>

<textarea
id="memoryInput"
placeholder="Contoh: Kunci motor aku sangkut tepi pintu utama.">
</textarea>
<button onclick="startVoice()">
🎙️ Cakap
</button>
<button onclick="saveMemory()">
💾 Simpan Memory
</button>

</div>


<!-- CARI -->

<div class="box">

<h2>🔍 Cari Memory</h2>

<input
id="searchInput"
placeholder="Contoh: kunci"
oninput="displayMemories()">

<div id="memoryList"></div>

</div>


<!-- SEJARAH -->

<div class="box">

<h2>📜 Sejarah Pertanyaan</h2>

<div id="historyList"></div>

<button class="clear" onclick="clearHistory()">
🗑️ Padam Semua Sejarah
</button>

</div>

</div>

</div>


<script>

/* =========================
   MEMORY
========================= */

function getMemories() {

  return JSON.parse(
    localStorage.getItem("otakku_memories")
  ) || [];

}


/* =========================
   SIMPAN MEMORY
========================= */

function saveMemory() {

  const input =
    document.getElementById("memoryInput");

  const text =
    input.value.trim();

  if (!text) {

    alert("Tulis dulu apa yang kau nak aku ingat.");

    return;
  }

  let memories = getMemories();

  memories.push({
    text: text,
    date: new Date().toLocaleString("ms-MY")
  });

  localStorage.setItem(
    "otakku_memories",
    JSON.stringify(memories)
  );

  input.value = "";

  displayMemories();

}


/* =========================
   PADAM MEMORY
========================= */

function deleteMemory(index) {

  let memories = getMemories();

  memories.splice(index, 1);

  localStorage.setItem(
    "otakku_memories",
    JSON.stringify(memories)
  );

  displayMemories();

}


/* =========================
   CARI MEMORY
========================= */

function displayMemories() {

  const list =
    document.getElementById("memoryList");

  const search =
    document.getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

  let memories = getMemories();

  const filtered =
    memories
    .map((memory, index) => ({
      memory,
      index
    }))
    .filter(item =>
      item.memory.text
      .toLowerCase()
      .includes(search)
    );

  if (filtered.length === 0) {

    list.innerHTML =
      '<div class="empty">Memory tidak dijumpai.</div>';

    return;
  }

  list.innerHTML = "";

  filtered.reverse().forEach(item => {

    const div =
      document.createElement("div");

    div.className = "memory";

    div.innerHTML =
      "<strong>" +
      item.memory.text +
      "</strong><br>" +

      "<small>" +
      item.memory.date +
      "</small>" +

      "<button class='delete' onclick='deleteMemory(" +
      item.index +
      ")'>🗑️ Padam</button>";

    list.appendChild(div);

  });

}


/* =========================
   SEJARAH
========================= */

function getHistory() {

  return JSON.parse(
    localStorage.getItem("otakku_history")
  ) || [];

}


function saveHistory(question, answer) {

  let history = getHistory();

  history.push({

    question: question,

    answer: answer,

    date: new Date().toLocaleString("ms-MY")

  });

  localStorage.setItem(
    "otakku_history",
    JSON.stringify(history)
  );

  displayHistory();

}


function displayHistory() {

  const list =
    document.getElementById("historyList");

  let history = getHistory();

  if (history.length === 0) {

    list.innerHTML =
      '<div class="empty">Belum ada sejarah pertanyaan.</div>';

    return;
  }

  list.innerHTML = "";

  history
    .slice()
    .reverse()
    .forEach(item => {

      const div =
        document.createElement("div");

      div.className = "history";

      div.innerHTML =

        "<div class='history-question'>" +
        "👤 " +
        item.question +
        "</div>" +

        "<div class='history-answer'>" +
        "🧠 " +
        item.answer +
        "</div>" +

        "<div class='history-date'>" +
        item.date +
        "</div>";

      list.appendChild(div);

    });

}


function clearHistory() {

  localStorage.removeItem(
    "otakku_history"
  );

  displayHistory();

}


/* =========================
   TANYA OTAKKU
========================= */

function askOtakku() {

  const question =
    document.getElementById("question")
    .value
    .toLowerCase()
    .trim();

  const answerBox =
    document.getElementById("answer");

  if (!question) {

    answerBox.innerHTML =
      '<div class="answer">Tanya aku sesuatu dulu 😊</div>';

    return;
  }

  const memories = getMemories();

  if (memories.length === 0) {

    const answer =
      "Aku belum ada memory. Cuba simpan sesuatu dulu.";

    answerBox.innerHTML =
      '<div class="answer">' +
      answer +
      '</div>';

    saveHistory(question, answer);

    return;
  }


  const stopWords = [

    "aku",
    "kau",
    "apa",
    "mana",
    "kat",
    "dekat",
    "di",
    "ke",
    "yang",
    "itu",
    "ini",
    "ada",
    "tak",
    "tidak",
    "pun",
    "nak",
    "ingin",
    "tahu",
    "tolong",
    "ingatkan"

  ];


  const words =
    question
    .replace(/[?!.,]/g, "")
    .split(/\s+/)
    .filter(word =>
      word.length > 2 &&
      !stopWords.includes(word)
    );


  let bestMemory = null;
  let bestScore = 0;


  memories.forEach(memory => {

    const text =
      memory.text.toLowerCase();

    let score = 0;

    words.forEach(word => {

      if (text.includes(word)) {

        score++;

      }

    });


    if (score > bestScore) {

      bestScore = score;

      bestMemory = memory;

    }

  });


  let finalAnswer;


  if (bestMemory && bestScore > 0) {

    finalAnswer =
      bestMemory.text;

    answerBox.innerHTML =
      '<div class="answer">' +
      '💡 <strong>Aku ingat:</strong><br><br>' +
      finalAnswer +
      '</div>';

  } else {

    finalAnswer =
      "Aku belum jumpa jawapan dalam memory aku.";

    answerBox.innerHTML =
      '<div class="answer">' +
      '🤔 ' +
      finalAnswer +
      '<br><br>' +
      'Cuba simpan perkara itu dulu.' +
      '</div>';

  }


  saveHistory(
    question,
    finalAnswer
  );

}


/* =========================
   START
========================= */

displayMemories();

displayHistory();
function startVoice() {

  if (!('webkitSpeechRecognition' in window) &&
      !('SpeechRecognition' in window)) {

    alert("Maaf, browser ini belum menyokong fungsi suara.");

    return;
  }

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  const recognition =
    new SpeechRecognition();

  recognition.lang = "ms-MY";

  recognition.continuous = false;

  recognition.interimResults = false;

  recognition.start();

  recognition.onstart = function() {

    alert("🎙️ Silakan bercakap...");

  };

  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript;

    document.getElementById("memoryInput").value = text;

  };

  recognition.onerror = function(event) {

    alert("❌ Tak dapat dengar suara. Cuba lagi.");

  };

}function voiceQuestion() {

  if (!('webkitSpeechRecognition' in window) &&
      !('SpeechRecognition' in window)) {

    alert("Maaf, browser ini belum menyokong fungsi suara.");
    return;
  }

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  const recognition =
    new SpeechRecognition();

  recognition.lang = "ms-MY";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.start();

  recognition.onstart = function() {
    alert("🎙️ Silakan tanya...");
  };

  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript;

    document.getElementById("question").value = text;

    // Terus jalankan fungsi Tanya
    askOtakku();
  };

  recognition.onerror = function() {

    alert("❌ Tak dapat dengar suara. Cuba lagi.");

  };

}function getReminders() {

  return JSON.parse(
    localStorage.getItem("otakku_reminders")
  ) || [];

}


function saveReminder() {

  const text =
    document.getElementById("reminderText")
    .value
    .trim();

  const date =
    document.getElementById("reminderDate")
    .value;

  const time =
    document.getElementById("reminderTime")
    .value;

  if (!text || !date || !time) {

    alert("Sila isi perkara, tarikh dan masa.");

    return;
  }

  let reminders = getReminders();

  reminders.push({

    text: text,

    date: date,

    time: time,

    created:
      new Date().toLocaleString("ms-MY")

  });

  localStorage.setItem(
    "otakku_reminders",
    JSON.stringify(reminders)
  );

  document.getElementById("reminderText").value = "";

  document.getElementById("reminderDate").value = "";

  document.getElementById("reminderTime").value = "";

  displayReminders();

}


function deleteReminder(index) {

  let reminders = getReminders();

  reminders.splice(index, 1);

  localStorage.setItem(
    "otakku_reminders",
    JSON.stringify(reminders)
  );

  displayReminders();

}


function displayReminders() {

  const list =
    document.getElementById("reminderList");

  if (!list) return;

  let reminders = getReminders();

  if (reminders.length === 0) {

    list.innerHTML =
      '<div class="empty">Belum ada reminder.</div>';

    return;
  }

  list.innerHTML = "";

  reminders.forEach((reminder, index) => {

    const div =
      document.createElement("div");

    div.className = "memory";

    div.innerHTML =

      "⏰ <strong>" +
      reminder.text +
      "</strong><br>" +

      "📅 " +
      reminder.date +
      "<br>" +

      "🕐 " +
      reminder.time +

      "<button class='delete' onclick='deleteReminder(" +
      index +
      ")'>🗑️ Padam</button>";

    list.appendChild(div);

  });

}


displayReminders();
</script>

</body>
</html>
